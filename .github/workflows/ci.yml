# CI (intégration continue) : à chaque push et à chaque PR, une machine de GitHub
# installe le projet puis lance le lint, les tests et le build.
# Si une étape échoue, la PR affiche une croix rouge et on ne merge pas.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js (version LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
